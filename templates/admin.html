<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Identity-First Voting</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Admin Dashboard</h2>
    <button class="btn btn-outline-danger" id="adminLogout">Logout</button>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <h5>Admin Login</h5>
      <div class="row g-2">
        <div class="col-md-4"><input class="form-control" id="adminUsername" placeholder="Username" value="admin"></div>
        <div class="col-md-4"><input type="password" class="form-control" id="adminPassword" placeholder="Password" value="admin@123"></div>
        <div class="col-md-4"><button class="btn btn-primary w-100" id="adminLogin">Login</button></div>
      </div>
      <small class="text-muted">Default seeded admin: admin / admin@123</small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-6">
      <div class="card h-100"><div class="card-body">
        <h5>Create Election</h5>
        <input class="form-control mb-2" id="electionName" placeholder="Election Name">
        <input class="form-control mb-2" id="clubName" placeholder="Club Name">
        <input type="date" class="form-control mb-2" id="electionDate">
        <button class="btn btn-primary" id="createElectionBtn">Create Election</button>
      </div></div>
    </div>

    <div class="col-lg-6">
      <div class="card h-100"><div class="card-body">
        <h5>Add Candidate</h5>
        <input class="form-control mb-2" id="candidateElectionId" placeholder="Election ID">
        <input class="form-control mb-2" id="candidateName" placeholder="Candidate Name">
        <input class="form-control mb-2" id="candidatePosition" placeholder="Position">
        <input class="form-control mb-2" id="candidatePhoto" placeholder="Photo URL (optional)">
        <button class="btn btn-primary" id="addCandidateBtn">Add Candidate</button>
      </div></div>
    </div>

    <div class="col-lg-6">
      <div class="card h-100"><div class="card-body">
        <h5>Register Voter (with biometric image)</h5>
        <input class="form-control mb-2" id="voterStudentId" placeholder="Student ID">
        <input class="form-control mb-2" id="voterName" placeholder="Name">
        <input class="form-control mb-2" id="voterDepartment" placeholder="Department">
        <input type="file" class="form-control mb-2" id="voterBiometric" accept="image/*">
        <button class="btn btn-primary" id="registerVoterBtn">Register Voter</button>
      </div></div>
    </div>

    <div class="col-lg-6">
      <div class="card h-100"><div class="card-body">
        <h5>Election Controls</h5>
        <input class="form-control mb-2" id="toggleElectionId" placeholder="Election ID">
        <div class="d-flex gap-2">
          <button class="btn btn-warning" id="toggleVotingBtn">Enable/Disable Voting</button>
          <button class="btn btn-success" id="publishResultsBtn">Publish Results</button>
        </div>
      </div></div>
    </div>

    <div class="col-12">
      <div class="card"><div class="card-body">
        <h5>Real-time Statistics</h5>
        <div class="row g-2">
          <div class="col-md-8"><input class="form-control" id="statsElectionId" placeholder="Election ID"></div>
          <div class="col-md-4"><button class="btn btn-dark w-100" id="loadStatsBtn">Load Stats</button></div>
        </div>
        <pre class="bg-dark text-white p-3 mt-3 rounded" id="statsOutput">No data loaded.</pre>
      </div></div>
    </div>
  </div>

  <div class="alert mt-3 d-none" id="adminAlert"></div>
</div>
<script src="/static/js/admin.js"></script>
</body>
</html>
